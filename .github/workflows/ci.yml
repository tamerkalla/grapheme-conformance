name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        # Node 22's ICU carries the deviation the baseline was measured on, so
        # there the Intl.Segmenter lock must assert rather than skip. Node 18
        # ships an ICU without it and scores 1187/1093; those rows skip.
        env:
          GRAPHEME_CONFORMANCE_STRICT_ICU: ${{ matrix.node == 22 && '1' || '' }}
      - run: npm run build
      - run: node scripts/smoke.mjs

  scoreboard:
    # The Intl.Segmenter row depends on the host ICU, so byte-reproducibility is
    # asserted on the runtime the committed scoreboard was generated with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scoreboard:check

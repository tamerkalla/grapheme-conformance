name: Release

# One button. Pick a bump, and CI verifies, versions, tags, publishes, pushes.
#
# There is deliberately no tag trigger: this workflow creates the tag itself,
# so a tag trigger would race with it and try to publish the same version twice.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump to apply before publishing
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Push the version commit and its tag back to main.
      contents: write
      # Trusted publishing: npm mints a short-lived credential from this OIDC
      # token, so there is no long-lived NPM_TOKEN to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates OIDC trusted publishing.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # Everything is verified before the version moves, so a failing check
      # leaves no orphan bump behind.
      - run: npm run typecheck
      - run: npm test
        env:
          GRAPHEME_CONFORMANCE_STRICT_ICU: '1'
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: npm run scoreboard:check

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          version="$(npm version '${{ inputs.bump }}' -m 'Release v%s')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumped to $version"

      # Publish before pushing: if this fails, main keeps the old version and
      # the run can simply be repeated. The reverse order would strand a
      # version in git that does not exist on npm.
      - run: npm publish --access public

      - name: Push the version commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Summary
        run: |
          echo "Published ${{ steps.bump.outputs.version }} to npm and pushed the tag." >> "$GITHUB_STEP_SUMMARY"
